{% set name = "black" %}
{% set version = "26.10.1" %}

package:
  name: black-recipe
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/black/black-{{ version }}.tar.gz
  sha256: 5f9f83beae62437e060dafd53d7f1fc327e3d3494f74d72ee5c2b73eb90fc4e7

build:
  number: 0

outputs:
  - name: black
    script: build_base.sh
    build:
      noarch: python
      entry_points:
        - black = black:patched_main
        - blackd = blackd:patched_main
    requirements:
      host:
        - python {{ python_min }}
        - pip
        - hatchling >=1.27.0
        - hatch-vcs >=0.3.0
        - hatch-fancy-pypi-readme
      run:
        - click >=8.0.0
        - platformdirs >=2
        - packaging >=22.0
        - pathspec >=1.0.0
        - mypy_extensions >=0.4.3
        - pytokens >=0.4.0,<0.5.0
        - python >={{ python_min }}
    test:
      requires:
        - python {{ python_min }}
        - pip
      commands:
        - black --help
        - pip check
        - which blackd || where blackd

  - name: blackd
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('black', max_pin='x.x.x') }}
        - aiohttp >=3.10
    test:
      requires:
        - python {{ python_min }}
      commands:
        - black --help
        - blackd --help

  - name: black-colorama
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('black', max_pin='x.x.x') }}
        - colorama >=0.4.3
    test:
      requires:
        - python {{ python_min }}
      commands:
        - black --help

  - name: black-jupyter
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('black', max_pin='x.x.x') }}
        - ipython >=7.8.0
        - tokenize-rt >=3.2.0
    test:
      requires:
        - python {{ python_min }}
      commands:
        - black --help
        - python -c "import black.handle_ipynb_magics; assert black.handle_ipynb_magics.jupyter_dependencies_are_installed(warn=True) == True"

about:
  home: https://github.com/psf/black
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: The uncompromising code formatter.

  description: |
    Black is the uncompromising Python code formatter. By using it, you agree
    to cease control over minutiae of hand-formatting. In return, Black gives
    you speed, determinism, and freedom from pycodestyle nagging about
    formatting. You will save time and mental energy for more important matters.
  doc_url: https://black.readthedocs.io/
  dev_url: https://github.com/psf/black

extra:
  recipe-maintainers:
    - raybellwaves
    - seanlaw
    - carlodri
    - ambv
    - mariusvniekerk
    - xhochy
